[project]
name = "my-shop"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.31.0",
    "alembic>=1.19.2",
    "python-dotenv>=1.2.3",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "redis>=8.1.0",
    "aioredis>=2.0.1",
    "aiokafka>=0.14.0",
    "boto3>=1.43.56",
    "aiobotocore>=3.9.0",
]

[dependency-groups]
dev = [    
    "mypy>=1.19.1",
    "ruff>=0.1.0",
]
