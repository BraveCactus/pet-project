[project]
name = "pet-project"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    # --- Web ---
    "fastapi>=0.119.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.9",

    # --- База данных ---
    "sqlalchemy>=2.0.41",
    "asyncpg>=0.31.0",
    "alembic>=1.19.2",
    "psycopg2-binary>=2.9.12",

    # --- Конфигурация и валидация ---
    "pydantic-settings>=2.15.0",
    "email-validator>=2.3.0",
    "python-dotenv>=1.2.3",

    # --- Аутентификация ---
    "authx>=1.0.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.3.0",        

    # --- Кэш и очередь ---
    "redis>=8.1.0",  
    "aiokafka>=0.14.0",

    # --- S3 (Yandex Object Storage) ---
    "boto3>=1.43.56",
    "aiobotocore>=3.9.0",

    # --- Логи и метрики ---
    "structlog>=24.0.0",
    "graypy>=2.1.0",
    "prometheus-fastapi-instrumentator>=7.1.0",

    # --- Почта ---
    "sendgrid>=6.11.0",

    # --- Аналитика (оставлено как есть) ---
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=30.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
dev = "app.main:dev"

[tool.hatch.build.targets.wheel]
packages = ["app"]